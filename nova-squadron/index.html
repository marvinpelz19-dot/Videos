<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

</head>
<body style="margin:0">
<title>Nova Squadron</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&family=Bangers&family=Comic+Neue:wght@700&display=swap">
<style>
/* Layout: ein Vollbild-Cockpit. Die Spielszene füllt alles, HUD in den vier Ecken, Menüs als Glasflächen darüber. */
:root {
  color-scheme: dark;
  --void: #04060c; --panel: rgba(9, 14, 26, 0.84); --line: rgba(140, 180, 255, 0.22);
  --ink: #e9f2ff; --dim: #8d9cba; --ember: #ff8a2a; --ion: #59c8ff; --danger: #ff4d4d; --gold: #ffd166; --ok: #7dffb0;
  --display: "Chakra Petch", "Eurostile", "Segoe UI", sans-serif; --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
  --gt: calc(12px + env(safe-area-inset-top, 0px)); --gb: calc(12px + env(safe-area-inset-bottom, 0px));
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--void); color: var(--ink); font-family: var(--body); font-size: 15px; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
#app { position: fixed; inset: 0; overflow: hidden; }
#view, #marks { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#marks { pointer-events: none; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--ion); outline-offset: 2px; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; font-family: var(--display); padding: var(--gt) var(--gr) var(--gb) var(--gl); }
#hud > * { position: absolute; }
.status { left: var(--gl); top: var(--gt); width: min(250px, 44vw); display: grid; gap: 5px; }
.lab { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
.lab b { color: var(--ink); font-weight: 600; }
.meter { height: 9px; background: rgba(120, 160, 255, 0.14); border: 1px solid var(--line); transform: skewX(-18deg); overflow: hidden; }
.meter i { display: block; height: 100%; transform-origin: left; background: var(--ion); box-shadow: 0 0 12px var(--ion); transition: transform 0.12s linear; }
#shield.low i { background: var(--danger); box-shadow: 0 0 12px var(--danger); }
#nova { pointer-events: auto; background: none; border: 0; padding: 0; text-align: left; display: grid; gap: 5px; }
#nova .meter i { background: var(--ember); box-shadow: 0 0 12px var(--ember); }
#nova.ready .lab b { color: var(--gold); animation: pulse 0.8s infinite alternate; }
@keyframes pulse { to { opacity: 0.45; } }
.inf { font-size: 12px; letter-spacing: 0.1em; color: var(--ok); }
.score { right: var(--gr); top: var(--gt); text-align: right; display: grid; justify-items: end; gap: 2px; }
.score b { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.score small { font-size: 12px; color: var(--gold); font-variant-numeric: tabular-nums; }
#combo { font-size: 13px; color: var(--ember); font-weight: 700; letter-spacing: 0.06em; }
#b-pause { pointer-events: auto; right: var(--gr); top: var(--gt); width: 48px; height: 48px; border-radius: 50%; background: rgba(9, 14, 26, 0.7); border: 1.5px solid rgba(233, 242, 255, 0.55); color: var(--ink); display: grid; place-items: center; padding: 0; z-index: 3; }
#b-pause svg { width: 24px; height: 24px; } #b-pause:active { background: rgba(90, 170, 255, 0.4); }
.score { right: calc(var(--gr) + 60px) !important; }
.wchip.hot { color: var(--danger); border-color: var(--danger); animation: pulse 0.25s infinite alternate; }
.ibtn { width: 40px; height: 40px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line); color: var(--ink); display: grid; place-items: center; padding: 0; } .ibtn svg { width: 20px; height: 20px; }
#mtoast { position: absolute; left: 50%; bottom: calc(var(--gb) + 20px); transform: translateX(-50%); max-width: min(92%, 520px); background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--gold); padding: 10px 14px; font-size: 14px; opacity: 0; pointer-events: none; z-index: 5; text-wrap: balance; }
#mtoast.show { animation: toast 4.5s ease-out; }
/* ---------- Comic ---------- */
.comic { background: #0b0d14 radial-gradient(rgba(255, 255, 255, 0.07) 1.2px, transparent 1.6px) 0 0 / 14px 14px; overflow-y: auto; align-items: center; padding: var(--gt) var(--gr) var(--gb) var(--gl); }
.cpage { --paper: #f4ead2; --ink2: #14131a; width: min(100%, 1180px); margin: auto 0; display: grid; gap: 12px; }
.ctitle { font-family: "Bangers", "Impact", "Arial Narrow", sans-serif; font-weight: 400; font-size: clamp(26px, 4.6vw, 50px); letter-spacing: 0.04em; color: #ffd84a; text-shadow: 3px 3px 0 #c8281e, 5px 5px 0 #000; transform: rotate(-1.2deg); margin: 0 0 2px 6px; line-height: 1; }
.cgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.cgrid.p1 { grid-template-columns: minmax(0, 1fr); } .cgrid.p1 .cpanel img { aspect-ratio: 16 / 8; }
.cpanel { position: relative; margin: 0; background: var(--paper); border: 4px solid var(--ink2); box-shadow: 6px 6px 0 #000; overflow: hidden; }
.cpanel.t0 { transform: rotate(-0.5deg); } .cpanel.t1 { transform: rotate(0.6deg); }
.cpanel img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; }
.ccap { position: absolute; left: 0; top: 0; max-width: 78%; background: #ffd84a; color: var(--ink2); border-right: 3px solid var(--ink2); border-bottom: 3px solid var(--ink2); padding: 6px 10px 5px; font-family: "Comic Neue", "Comic Sans MS", "Trebuchet MS", sans-serif; font-weight: 700; font-size: clamp(12px, 1.5vw, 16px); line-height: 1.25; text-transform: uppercase; }
.bubble { position: absolute; bottom: 14px; max-width: 70%; background: #fff; color: var(--ink2); border: 3px solid var(--ink2); border-radius: 20px; padding: 8px 14px 9px; font-family: "Comic Neue", "Comic Sans MS", "Trebuchet MS", sans-serif; font-weight: 700; font-size: clamp(13px, 1.6vw, 17px); line-height: 1.25; box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.5); }
.bubble.b0 { left: 14px; border-bottom-left-radius: 2px; } .bubble.b1 { right: 14px; border-bottom-right-radius: 2px; }
.bubble b { display: block; font-family: "Bangers", "Impact", sans-serif; font-weight: 400; letter-spacing: 0.05em; font-size: 0.95em; color: #c8281e; }
.cgoal { grid-column: 1 / -1; display: grid; gap: 4px; padding: 14px 18px 14px 150px; color: var(--ink2); font-family: "Comic Neue", "Comic Sans MS", "Trebuchet MS", sans-serif; font-weight: 700; background: var(--paper) radial-gradient(rgba(200, 40, 30, 0.16) 1.4px, transparent 1.8px) 0 0 / 10px 10px; }
.cgoal .burst { position: absolute; left: 14px; top: 50%; transform: translateY(-50%) rotate(-7deg); font-family: "Bangers", "Impact", sans-serif; font-weight: 400; font-size: 26px; letter-spacing: 0.04em; color: #fff; background: #c8281e; border: 3px solid var(--ink2); padding: 8px 14px; box-shadow: 4px 4px 0 #000; white-space: nowrap; }
.cgoal b { font-size: clamp(16px, 2.2vw, 22px); line-height: 1.2; text-wrap: balance; } .cgoal p { margin: 0; font-size: clamp(13px, 1.5vw, 15.5px); line-height: 1.35; } .foes i { font-style: normal; font-family: "Bangers", "Impact", sans-serif; font-weight: 400; letter-spacing: 0.06em; color: #c8281e; margin-right: 6px; }
.crow { justify-content: center; margin-top: 4px; }
.comic { padding: 0; align-items: stretch; overflow: hidden; }
.cv { --paper: #f4ead2; --ink2: #14131a; flex: 1; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; padding: var(--gt) var(--gr) var(--gb) var(--gl); }
.cvh { display: flex; justify-content: space-between; align-items: center; gap: 12px; } .cvh .ctitle { font-size: clamp(20px, 3.4vw, 38px); margin: 0; }
.cstage { display: grid; place-items: center; min-height: 0; cursor: pointer; }
.cpanel.big { width: min(100%, calc((100vh - 170px) * 1.5), 1240px); box-shadow: 8px 8px 0 #000; }
.cpanel.big img { aspect-ratio: 3 / 2; }
.cpanel.enter { animation: cin 0.38s cubic-bezier(0.2, 0.9, 0.3, 1.2); }
@keyframes cin { from { opacity: 0; transform: scale(0.94) rotate(-2deg); } }
.cpanel.big .ccap { font-size: clamp(13px, 1.7vw, 19px); padding: 8px 14px 7px; max-width: 70%; }
.cbubs { display: grid; gap: 8px; pointer-events: none; }
/* Text steht neben dem Bild (Querformat) oder darunter (Hochformat), nie auf den Figuren */
.cpanel.big { display: grid; grid-template-columns: 70% 30%; grid-template-rows: auto auto minmax(0, 1fr); aspect-ratio: 2.143; width: min(100%, calc((100vh - 170px) * 2.14), 1500px); background: var(--paper); }
.cpanel.big img { grid-column: 1; grid-row: 1 / -1; height: 100%; min-height: 0; aspect-ratio: auto; border-right: 4px solid var(--ink2); }
.cpanel.big .ccap, .cpanel.big .cfx, .cpanel.big .cbubs { position: static; grid-column: 2; }
.cpanel.big .ccap { max-width: none; border-right: 0; }
.cpanel.big .cfx { justify-self: center; margin: 8px 0 0; transform: rotate(-4deg); font-size: clamp(24px, 3.4vw, 46px); }
.cpanel.big .cbubs { padding: 10px; align-content: start; overflow-y: auto; }
.cpanel.big .cbubs .bubble { max-width: 96%; box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.55); }
.cpanel.cgoal.big { display: grid; grid-template-columns: none; grid-template-rows: none; aspect-ratio: auto; }
@media (max-height: 520px) and (orientation: landscape) { .cvh .ctitle { font-size: 18px; } .cv { gap: 4px; } .cpanel.big { grid-template-columns: 62% 38%; aspect-ratio: 2.42; width: min(100%, calc((100vh - 96px) * 2.42)); } .cbubs { gap: 5px; } .cpanel.big .cbubs { padding: 6px; } .cbubs .bubble { font-size: 13px; padding: 5px 10px 6px; } .cpanel.big .ccap { font-size: 12px; padding: 5px 9px; } }
.cbubs .bubble { position: static; max-width: min(74%, 560px); font-size: clamp(14px, 1.8vw, 20px); }
.cbubs .bubble.b0 { justify-self: start; } .cbubs .bubble.b1 { justify-self: end; }
.bubble.pop { animation: pop 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.5); } @keyframes pop { from { opacity: 0; transform: scale(0.6) translateY(10px); } }
.cfx { position: absolute; right: 4%; top: 12%; font-family: "Bangers", "Impact", sans-serif; font-size: clamp(30px, 6.5vw, 86px); letter-spacing: 0.04em; color: #ffd84a; -webkit-text-stroke: 2px #14131a; text-shadow: 4px 4px 0 #c8281e, 7px 7px 0 #000; transform: rotate(-9deg); animation: fxin 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.6) 0.15s both; pointer-events: none; }
@keyframes fxin { from { opacity: 0; transform: rotate(-9deg) scale(2.2); } }
.cvf { display: flex; justify-content: space-between; align-items: center; gap: 12px; } .chint { font-family: var(--display); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); animation: pulse 1s infinite alternate; }
.cdots { display: flex; gap: 5px; flex-wrap: wrap; } .cdots i { width: 16px; height: 5px; background: rgba(255, 255, 255, 0.18); transform: skewX(-18deg); } .cdots i.on { background: #ffd84a; } .cdots i.cur { background: #fff; }
.cgoal.big { width: min(100%, 760px); padding: 70px 26px 26px; gap: 10px; cursor: default; } .cgoal.big .burst { top: 14px; left: 18px; transform: rotate(-5deg); font-size: 30px; } .cgoal.big b { font-size: clamp(20px, 3vw, 30px); } .cgoal.big p { font-size: clamp(15px, 1.8vw, 18px); } .cgoal.big .row { margin-top: 8px; }
.btn.ghost.dark { color: #14131a; border-color: #14131a; }
@media (orientation: portrait), (max-width: 700px) { .cpanel.big { display: block; aspect-ratio: auto; width: 100%; overflow: visible; background: var(--paper); } .cpanel.big img { height: auto; aspect-ratio: 3 / 2; border-right: 0; border-bottom: 4px solid var(--ink2); } .cpanel.big .cfx { display: block; text-align: center; } .cbubs { padding: 10px; } .cbubs .bubble { max-width: 92%; box-shadow: none; } .cfx { top: 16%; } .cstage { align-items: start; overflow-y: auto; } }
@media (prefers-reduced-motion: reduce) { .cpanel.enter, .bubble.pop, .cfx, .chint { animation: none; } }
@media (max-width: 760px), (orientation: portrait) { .cgrid { grid-template-columns: minmax(0, 1fr); } .cgoal { padding: 52px 14px 14px; } .cgoal .burst { top: 8px; transform: rotate(-4deg); font-size: 20px; padding: 4px 12px; } .bubble { max-width: 84%; } .comic { align-items: stretch; } }
@media (prefers-reduced-motion: reduce) { .wchip.hot { animation: none; } }

.objective { left: 50%; top: var(--gt); transform: translateX(-50%); text-align: center; width: min(420px, 46vw); display: grid; gap: 4px; }
#obj { font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; text-shadow: 0 1px 8px #000; text-wrap: balance; }
#obj-n { font-size: 12px; color: var(--gold); letter-spacing: 0.1em; }
#boss, #convoy { display: grid; gap: 3px; margin-top: 4px; }
#boss .meter i { background: var(--danger); box-shadow: 0 0 12px var(--danger); }
#convoy .meter i { background: var(--ion); box-shadow: 0 0 10px var(--ion); }
#boss-name, #convoy span { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
#warn { left: 50%; top: 32%; transform: translateX(-50%); color: var(--danger); font-weight: 700; letter-spacing: 0.14em; font-size: 14px; text-align: center; animation: pulse 0.5s infinite alternate; }
#weapons { left: 50%; bottom: var(--gb); transform: translateX(-50%); display: flex; gap: 6px; pointer-events: auto; max-width: calc(100% - 32px); }
.wchip { position: relative; width: 44px; height: 44px; border-radius: 50%; padding: 0; display: grid; place-items: center; background: rgba(9, 14, 26, 0.6); border: 1.5px solid var(--line); color: var(--dim); }
.wchip svg { width: 22px; height: 22px; } .wchip span { position: absolute; right: -2px; top: -4px; font-size: 10px; font-family: var(--display); color: var(--dim); }
.wchip.on { color: var(--wc); border-color: var(--wc); box-shadow: 0 0 16px -4px var(--wc), inset 0 0 10px -6px var(--wc); }
body.touch .wchip span { display: none; }
#pips { display: flex; gap: 5px; justify-content: center; } #pips i { width: 22px; height: 4px; background: rgba(140, 180, 255, 0.2); transform: skewX(-18deg); } #pips i.on { background: var(--gold); box-shadow: 0 0 8px var(--gold); } #pips i.cur { background: var(--ink); animation: pulse 0.7s infinite alternate; }
#goal { left: 50%; top: calc(var(--gt) + 64px); transform: translate(-50%, 10px); width: min(92%, 520px); pointer-events: none; opacity: 0; transition: opacity 0.4s, transform 0.4s; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--gold); padding: 14px 18px; text-align: left; display: grid; gap: 5px; font-family: var(--body); color: var(--ink); }
#goal.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#goal em { font-style: normal; font-family: var(--display); font-weight: 700; font-size: clamp(18px, 3vw, 26px); letter-spacing: 0.08em; text-transform: uppercase; text-wrap: balance; margin-bottom: 4px; }
#goal span { font-family: var(--display); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); } #goal b { font-family: var(--display); font-size: clamp(16px, 2.4vw, 21px); line-height: 1.2; text-wrap: balance; }
#goal p { margin: 0; font-size: 14px; line-height: 1.4; color: var(--dim); } #goal small { font-family: var(--display); font-size: 11px; letter-spacing: 0.1em; color: var(--ok); }
.spd.stun, .spd.stun b { color: var(--danger); }
.wchip.jam { color: var(--danger); border-color: var(--danger); opacity: 0.55; } .wchip.jam::after { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; height: 2px; background: var(--danger); transform: rotate(-45deg); }
.listh { margin: 6px 0 0; font-family: var(--display); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); }
.mcard.endless { border-color: rgba(255, 209, 102, 0.5); } .mcard.endless .num { color: var(--gold); }
#choice { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; gap: 12px; padding: var(--gt) var(--gr) var(--gb) var(--gl); background: radial-gradient(ellipse at center, rgba(4, 6, 12, 0.5), rgba(4, 6, 12, 0.86)); text-align: center; overflow-y: auto; animation: rise 0.35s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
#choice h2 { font-size: clamp(24px, 4.6vw, 44px); letter-spacing: 0.06em; text-shadow: 0 0 30px rgba(255, 138, 42, 0.6); }
#choice.boss h2 { color: var(--gold); text-shadow: 0 0 30px rgba(255, 209, 102, 0.7); } #choice.boss .eyebrow { color: var(--gold); }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 300px)); gap: 14px; width: min(100%, 640px); margin-top: 8px; }
.ccard { position: relative; display: grid; gap: 8px; justify-items: center; align-content: start; padding: 22px 16px 18px; background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--ember); color: var(--ink); font-family: var(--body); transition: transform 0.14s, border-color 0.14s, box-shadow 0.14s; }
.ccard:hover, .ccard:focus-visible { transform: translateY(-4px); border-color: var(--ember); box-shadow: 0 10px 40px -12px rgba(255, 138, 42, 0.7); }
#choice.boss .ccard { border-top-color: var(--gold); } #choice.boss .ccard:hover { border-color: var(--gold); box-shadow: 0 10px 40px -12px rgba(255, 209, 102, 0.8); }
.ccard svg { width: 46px; height: 46px; color: var(--ember); } #choice.boss .ccard svg { color: var(--gold); }
.ccard b { font-family: var(--display); font-size: clamp(16px, 2.4vw, 20px); letter-spacing: 0.04em; text-wrap: balance; } .ccard span { font-size: 14px; line-height: 1.4; color: var(--dim); text-wrap: balance; }
.ccard .pips { margin-top: 4px; } .ccard .pips i.new { background: var(--ink); animation: pulse 0.6s infinite alternate; } .ccard .once { font-style: normal; font-family: var(--display); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
.ccard em { position: absolute; left: 8px; top: 6px; font-style: normal; font-family: var(--display); font-size: 12px; color: var(--dim); border: 1px solid var(--line); padding: 0 6px; } body.touch .ccard em { display: none; }
@media (max-width: 520px) { .cards { grid-template-columns: 1fr; } .ccard { grid-template-columns: auto 1fr; justify-items: start; text-align: left; padding: 14px; column-gap: 14px; } .ccard svg { grid-row: 1 / span 3; align-self: center; } }
.reward.aim { font-size: 16px; color: var(--ink); font-weight: 600; }
#comms { left: var(--gl); bottom: calc(var(--gb) + 8px); width: min(330px, 60vw); background: var(--panel); border-left: 3px solid var(--ion); padding: 9px 12px; display: grid; gap: 2px; opacity: 0; transform: translateX(-14px); transition: opacity 0.25s, transform 0.25s; font-family: var(--body); }
#comms.show { opacity: 1; transform: none; }
#comms b { font-family: var(--display); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ion); }
#comms span { font-size: 14px; line-height: 1.35; }
#banner { left: 50%; top: calc(var(--gt) + 62px); transform: translate(-50%, 8px); text-align: center; opacity: 0; transition: opacity 0.3s, transform 0.3s; width: min(90%, 640px); display: grid; gap: 4px; }
#banner.show { opacity: 1; transform: translate(-50%, 0); }
#banner b { font-size: clamp(16px, 2.8vw, 26px); font-weight: 700; letter-spacing: 0.16em; text-shadow: 0 0 24px rgba(255, 138, 42, 0.8), 0 2px 10px #000; text-wrap: balance; }
#banner small { font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
#flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
#flash.f-hit { box-shadow: inset 0 0 120px 30px rgba(255, 60, 60, 0.55); animation: fl 0.35s ease-out; }
#flash.f-down { background: rgba(120, 190, 255, 0.5); animation: fl 0.8s ease-out; }
#flash.f-nova { background: rgba(255, 255, 255, 0.8); animation: fl 0.7s ease-out; }
@keyframes fl { from { opacity: 1; } to { opacity: 0; } }

/* ---------- Touch ---------- */
#stick { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }
#stick::before { content: ""; position: absolute; left: -62px; top: -62px; width: 124px; height: 124px; border-radius: 50%; border: 2px solid rgba(160, 200, 255, 0.4); background: rgba(90, 140, 255, 0.08); }
#knob { position: absolute; left: -26px; top: -26px; width: 52px; height: 52px; border-radius: 50%; background: rgba(160, 210, 255, 0.5); }
#touch { position: absolute; right: var(--gr); bottom: calc(var(--gb) + 12px); width: 240px; height: 232px; pointer-events: none; }
#touch button { position: absolute; pointer-events: auto; border-radius: 50%; border: 1.5px solid var(--line); background: rgba(12, 20, 38, 0.42); color: rgba(233, 242, 255, 0.85); width: 54px; height: 54px; padding: 0; display: grid; place-items: center; }
#touch button.down { background: rgba(90, 170, 255, 0.4); }
#touch svg { width: 24px; height: 24px; }

#t-boost { right: 108px; bottom: 2px; width: 62px !important; height: 62px !important; }
